<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <!-- Solid Onyx Foundation -->
  <rect width="36" height="36" fill="#09090B" />
  
  <!-- Outer Technical Stroke -->
  <rect x="0.5" y="0.5" width="35" height="35" fill="none" stroke="#27272A" stroke-width="1" />
  
  <!-- Left Vertical Backbone Pillar -->
  <rect x="7" y="6" width="5.5" height="24" fill="#FFFFFF" />
  
  <!-- Upper Kinetic Chevron (Cobalt) -->
  <polygon points="14,18 24.5,7.5 29,7.5 18.5,18" fill="#2563EB" />
  
  <!-- Lower Kinetic Chevron (Sky) -->
  <polygon points="18.5,18 29,28.5 24.5,28.5 14,18" fill="#60A5FA" />
  
  <!-- Center Energy Core Accent (Amber) -->
  <rect x="13.5" y="15.5" width="5" height="5" fill="#F59E0B" />
</svg>
